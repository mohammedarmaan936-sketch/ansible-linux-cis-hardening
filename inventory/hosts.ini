# ==============================================================================
# CIS Hardening Inventory - Ubuntu Fleet
# ==============================================================================

[local]
localhost ansible_connection=local ansible_python_interpreter=/usr/bin/python3

[staging]
# AWS EC2 Staging Bastion & Application Nodes
staging-node-01.internal ansible_host=10.0.10.15 ansible_user=ubuntu ansible_ssh_private_key_file=~/.ssh/staging-key.pem
staging-node-02.internal ansible_host=10.0.10.16 ansible_user=ubuntu ansible_ssh_private_key_file=~/.ssh/staging-key.pem

[production]
# AWS EC2 Production Compute & Database Nodes
prod-sec-api-01.internal ansible_host=10.0.20.10 ansible_user=ubuntu ansible_ssh_private_key_file=~/.ssh/prod-key.pem
prod-sec-api-02.internal ansible_host=10.0.20.11 ansible_user=ubuntu ansible_ssh_private_key_file=~/.ssh/prod-key.pem
prod-sec-db-01.internal  ansible_host=10.0.20.50 ansible_user=ubuntu ansible_ssh_private_key_file=~/.ssh/prod-key.pem

# Group hierarchy
[ubuntu_servers:children]
staging
production
local

# Common variables for Ubuntu instances
[ubuntu_servers:vars]
ansible_python_interpreter=/usr/bin/python3
ansible_ssh_common_args='-o StrictHostKeyChecking=no'

