---
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        exclude: ^roles/.*/templates/
      - id: check-added-large-files

  - repo: https://github.com/adrienverge/yamllint
    rev: v1.35.1
    hooks:
      - id: yamllint
        args: [-c, .yamllint]

  - repo: local
    hooks:
      - id: cis-compliance-audit
        name: CIS Level 1 Benchmark Compliance Audit
        entry: python3 scripts/cis_compliance_audit.py --format summary
        language: system
        pass_filenames: false
        always_run: true

