<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 640" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080c16" />
      <stop offset="50%" stop-color="#0d1424" />
      <stop offset="100%" stop-color="#060913" />
    </linearGradient>

    <!-- Card Background -->
    <linearGradient id="card-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141e33" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#0d1526" stop-opacity="0.98" />
    </linearGradient>

    <!-- Gate 3 Highlight Gradient -->
    <linearGradient id="gate3-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06382b" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#04231b" stop-opacity="0.98" />
    </linearGradient>

    <!-- Badge Gradient -->
    <linearGradient id="badge-green" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#065f46" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>

    <!-- Flow Line Gradients -->
    <linearGradient id="flow-cyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <linearGradient id="flow-emerald" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="cyber-grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1f2d47" stroke-width="0.75" stroke-opacity="0.25" />
      <circle cx="0" cy="0" r="1.5" fill="#00f2fe" fill-opacity="0.2" />
    </pattern>

    <!-- Drop Shadow Filter -->
    <filter id="card-shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000000" flood-opacity="0.6" />
    </filter>

    <!-- CSS Animations -->
    <style>
      @keyframes dashFlow {
        from { stroke-dashoffset: 40; }
        to { stroke-dashoffset: 0; }
      }
      @keyframes shieldPulse {
        0%, 100% { transform: scale(1); opacity: 0.95; }
        50% { transform: scale(1.02); opacity: 1; }
      }
      @keyframes beaconBlink {
        0%, 100% { fill: #10b981; filter: drop-shadow(0 0 4px #10b981); }
        50% { fill: #34d399; filter: drop-shadow(0 0 10px #34d399); }
      }
      .flowing-cyan {
        stroke-dasharray: 8, 8;
        animation: dashFlow 1.6s linear infinite;
      }
      .flowing-emerald {
        stroke-dasharray: 8, 8;
        animation: dashFlow 1.4s linear infinite;
      }
      .pulse-shield {
        animation: shieldPulse 3s ease-in-out infinite;
        transform-origin: 180px 570px;
      }
      .beacon-dot {
        animation: beaconBlink 2s ease-in-out infinite;
      }
      text {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        text-rendering: geometricPrecision;
      }
      .mono {
        font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
      }
    </style>
  </defs>

  <!-- Background Canvas -->
  <rect width="1080" height="640" fill="url(#bg-grad)" rx="16" />
  <rect width="1080" height="640" fill="url(#cyber-grid)" rx="16" />

  <!-- Background Glow Orbs -->
  <circle cx="100" cy="100" r="180" fill="#00f2fe" fill-opacity="0.04" />
  <circle cx="540" cy="300" r="220" fill="#8b5cf6" fill-opacity="0.03" />
  <circle cx="980" cy="520" r="200" fill="#10b981" fill-opacity="0.04" />

  <!-- ========================================================================= -->
  <!-- TOP BANNER                                                                -->
  <!-- ========================================================================= -->
  <g transform="translate(25, 20)">
    <!-- Shield Logo -->
    <rect x="0" y="0" width="50" height="50" rx="12" fill="#162238" stroke="#00f2fe" stroke-width="2" />
    <path d="M 25 11 L 38 16 V 28 C 38 36 32 42 25 44 C 18 42 12 36 12 28 V 16 Z" fill="none" stroke="#00f2fe" stroke-width="2.4" stroke-linejoin="round" />
    <path d="M 19 27 L 24 32 L 32 20" fill="none" stroke="#10b981" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Main Title & Subtitle -->
    <text x="64" y="25" font-size="24" font-weight="900" fill="#ffffff" letter-spacing="0.3px">ansible-linux-cis-hardening</text>
    <text x="64" y="45" font-size="14.5" font-weight="600" fill="#94a3b8">Automated CIS Benchmark Level 1 Hardening &amp; Drift Audit Pipeline</text>

    <!-- OS Pills (Top Right) -->
    <g transform="translate(725, 6)">
      <rect x="0" y="0" width="145" height="38" rx="8" fill="#182236" stroke="#e95420" stroke-width="1.8" />
      <circle cx="18" cy="19" r="5.5" fill="#e95420" />
      <text x="32" y="24" font-size="14" font-weight="800" fill="#ffffff">Ubuntu 22.04 LTS</text>

      <rect x="160" y="0" width="145" height="38" rx="8" fill="#182236" stroke="#e95420" stroke-width="1.8" />
      <circle cx="178" cy="19" r="5.5" fill="#e95420" />
      <text x="192" y="24" font-size="14" font-weight="800" fill="#ffffff">Ubuntu 24.04 LTS</text>
    </g>
  </g>

  <!-- ========================================================================= -->
  <!-- PIPELINE CONNECTORS                                                       -->
  <!-- ========================================================================= -->
  <!-- Stage 1 -> Stage 2 -->
  <path d="M 315 295 L 345 295" fill="none" stroke="#22334f" stroke-width="4" />
  <path d="M 315 295 L 345 295" fill="none" stroke="url(#flow-cyan)" stroke-width="3.5" class="flowing-cyan" />
  <polygon points="349,295 339,289 339,301" fill="#00f2fe" />

  <!-- Stage 2 -> Stage 3 -->
  <path d="M 735 295 L 765 295" fill="none" stroke="#22334f" stroke-width="4" />
  <path d="M 735 295 L 765 295" fill="none" stroke="url(#flow-emerald)" stroke-width="3.5" class="flowing-emerald" />
  <polygon points="769,295 759,289 759,301" fill="#10b981" />

  <!-- ========================================================================= -->
  <!-- STAGE 1: DEVSECOPS SOURCE                                                -->
  <!-- ========================================================================= -->
  <g transform="translate(25, 95)">
    <rect width="290" height="410" rx="14" fill="url(#card-grad)" stroke="#1e2c45" stroke-width="1.5" filter="url(#card-shadow)" />

    <!-- Header -->
    <rect width="290" height="48" rx="14" fill="#0e172a" />
    <path d="M 0 32 H 290 V 48 H 0 Z" fill="#0e172a" />
    <circle cx="22" cy="24" r="6" fill="#38bdf8" />
    <text x="36" y="29" font-size="16" font-weight="900" fill="#ffffff">STAGE 1: DEVSECOPS</text>
    <rect x="210" y="12" width="70" height="24" rx="5" fill="#1e293b" />
    <text x="219" y="28" font-size="11.5" font-weight="800" fill="#38bdf8">IaC REPO</text>

    <!-- Card 1: Event Trigger -->
    <g transform="translate(14, 60)">
      <rect width="262" height="98" rx="10" fill="#17223b" stroke="#293b5e" stroke-width="1.5" />
      <text x="16" y="26" font-size="13.5" font-weight="700" fill="#94a3b8">Source Event Trigger</text>
      <text x="16" y="55" class="mono" font-size="16" font-weight="800" fill="#38bdf8">git push origin main</text>
      <text x="16" y="81" font-size="13" font-weight="600" fill="#64748b">Triggers automated CIS gate</text>
    </g>

    <!-- Card 2: Master Playbook -->
    <g transform="translate(14, 172)">
      <rect width="262" height="98" rx="10" fill="#131b2e" stroke="#1f2d47" stroke-width="1.5" />
      <text x="16" y="26" font-size="13.5" font-weight="700" fill="#94a3b8">Master Hardening Playbook</text>
      <text x="16" y="55" class="mono" font-size="18" font-weight="800" fill="#ffffff">site.yml</text>
      <text x="16" y="81" font-size="13" font-weight="600" fill="#64748b">Tags: ssh, sysctl, ufw, audit</text>
    </g>

    <!-- Card 3: Modular CIS Role -->
    <g transform="translate(14, 284)">
      <rect width="262" height="110" rx="10" fill="#131b2e" stroke="#1f2d47" stroke-width="1.5" />
      <text x="16" y="26" font-size="13.5" font-weight="700" fill="#94a3b8">Modular Ansible Role</text>
      <text x="16" y="54" class="mono" font-size="16" font-weight="800" fill="#a78bfa">cis_ubuntu_hardening</text>
      <text x="16" y="78" font-size="13" font-weight="700" fill="#cbd5e1">defaults/ · tasks/ · handlers/</text>
      <text x="16" y="97" font-size="12" font-weight="600" fill="#64748b">Fleet: inventory/hosts.ini</text>
    </g>
  </g>

  <!-- ========================================================================= -->
  <!-- STAGE 2: GITHUB ACTIONS CI/CD GATES                                       -->
  <!-- ========================================================================= -->
  <g transform="translate(345, 95)">
    <rect width="390" height="410" rx="14" fill="url(#card-grad)" stroke="#38bdf8" stroke-width="2" stroke-opacity="0.5" filter="url(#card-shadow)" />

    <!-- Header -->
    <rect width="390" height="48" rx="14" fill="#0e172a" />
    <path d="M 0 32 H 390 V 48 H 0 Z" fill="#0e172a" />
    <circle cx="22" cy="24" r="6" fill="#8b5cf6" />
    <text x="36" y="29" font-size="16" font-weight="900" fill="#ffffff">STAGE 2: CI/CD GATES</text>
    <rect x="295" y="12" width="80" height="24" rx="5" fill="#1e293b" />
    <text x="306" y="28" font-size="12" font-weight="900" fill="#38bdf8">4 GATES</text>

    <!-- Gate 1: Syntax Validation -->
    <g transform="translate(14, 60)">
      <rect width="362" height="60" rx="8" fill="#131d30" stroke="#223352" stroke-width="1.5" />
      <circle cx="26" cy="30" r="12" fill="#065f46" />
      <path d="M 21 30 L 25 34 L 32 26" fill="none" stroke="#a7f3d0" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
      <text x="48" y="27" font-size="16" font-weight="800" fill="#ffffff">Gate 1: Syntax Validation</text>
      <text x="48" y="47" class="mono" font-size="13" font-weight="600" fill="#94a3b8">ansible-playbook --syntax-check</text>
      <rect x="282" y="17" width="68" height="26" rx="5" fill="#064e3b" />
      <text x="291" y="34" font-size="12.5" font-weight="900" fill="#34d399">PASSED</text>
    </g>

    <!-- Gate 2: Ansible-Lint -->
    <g transform="translate(14, 128)">
      <rect width="362" height="60" rx="8" fill="#131d30" stroke="#223352" stroke-width="1.5" />
      <circle cx="26" cy="30" r="12" fill="#065f46" />
      <path d="M 21 30 L 25 34 L 32 26" fill="none" stroke="#a7f3d0" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
      <text x="48" y="27" font-size="16" font-weight="800" fill="#ffffff">Gate 2: Ansible-Lint Quality</text>
      <text x="48" y="47" class="mono" font-size="13" font-weight="600" fill="#94a3b8">yamllint &amp; ansible-lint site.yml</text>
      <rect x="282" y="17" width="68" height="26" rx="5" fill="#064e3b" />
      <text x="291" y="34" font-size="12.5" font-weight="900" fill="#34d399">PASSED</text>
    </g>

    <!-- Gate 3: CIS Benchmark Compliance Gate (HERO HIGHLIGHT) -->
    <g transform="translate(14, 196)">
      <rect width="362" height="130" rx="10" fill="url(#gate3-grad)" stroke="#10b981" stroke-width="2.5" />
      <circle cx="28" cy="32" r="14" fill="#047857" />
      <path d="M 22 32 L 27 37 L 35 27" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
      <text x="50" y="32" font-size="17" font-weight="900" fill="#34d399">Gate 3: CIS Compliance</text>
      <rect x="264" y="18" width="86" height="28" rx="6" fill="#10b981" />
      <text x="272" y="36" font-size="13" font-weight="900" fill="#022c22">100% PASS</text>
      
      <text x="16" y="68" class="mono" font-size="14.5" font-weight="800" fill="#ffffff">python3 scripts/cis_compliance_audit.py</text>
      <text x="16" y="96" font-size="16" font-weight="900" fill="#a7f3d0">Score: 100.0% (15/15 Controls Enforced)</text>
      <text x="16" y="118" font-size="13" font-weight="700" fill="#34d399">✓ Zero Security Drift · Mandatory Merge Barrier</text>
    </g>

    <!-- Gate 4: Container Dry-Run -->
    <g transform="translate(14, 334)">
      <rect width="362" height="60" rx="8" fill="#131d30" stroke="#223352" stroke-width="1.5" />
      <circle cx="26" cy="30" r="12" fill="#065f46" />
      <path d="M 21 30 L 25 34 L 32 26" fill="none" stroke="#a7f3d0" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
      <text x="48" y="27" font-size="16" font-weight="800" fill="#ffffff">Gate 4: Container Dry-Run</text>
      <text x="48" y="47" class="mono" font-size="13" font-weight="600" fill="#94a3b8">Ubuntu 22.04 &amp; 24.04 clean verify</text>
      <rect x="282" y="17" width="68" height="26" rx="5" fill="#064e3b" />
      <text x="291" y="34" font-size="12.5" font-weight="900" fill="#34d399">PASSED</text>
    </g>
  </g>

  <!-- ========================================================================= -->
  <!-- STAGE 3: HARDENED UBUNTU FLEET                                            -->
  <!-- ========================================================================= -->
  <g transform="translate(765, 95)">
    <rect width="290" height="410" rx="14" fill="url(#card-grad)" stroke="#10b981" stroke-width="2" stroke-opacity="0.5" filter="url(#card-shadow)" />

    <!-- Header -->
    <rect width="290" height="48" rx="14" fill="#0e172a" />
    <path d="M 0 32 H 290 V 48 H 0 Z" fill="#0e172a" />
    <circle cx="22" cy="24" r="6" fill="#10b981" class="beacon-dot" />
    <text x="36" y="29" font-size="16" font-weight="900" fill="#ffffff">STAGE 3: HARDENED FLEET</text>
    <rect x="215" y="12" width="65" height="24" rx="5" fill="#064e3b" />
    <text x="226" y="28" font-size="12" font-weight="900" fill="#34d399">ACTIVE</text>

    <!-- Node 1: SSH -->
    <g transform="translate(14, 60)">
      <rect width="262" height="76" rx="8" fill="#131e33" stroke="#223554" stroke-width="1.5" />
      <rect x="0" y="0" width="5" height="76" rx="2.5" fill="#00f2fe" />
      <text x="16" y="28" font-size="16" font-weight="800" fill="#ffffff">OpenSSH Hardening</text>
      <text x="16" y="55" class="mono" font-size="14.5" font-weight="800" fill="#38bdf8">PermitRootLogin no (Keys Only)</text>
    </g>

    <!-- Node 2: Kernel Sysctl -->
    <g transform="translate(14, 144)">
      <rect width="262" height="76" rx="8" fill="#131e33" stroke="#223554" stroke-width="1.5" />
      <rect x="0" y="0" width="5" height="76" rx="2.5" fill="#a855f7" />
      <text x="16" y="28" font-size="16" font-weight="800" fill="#ffffff">Kernel ASLR &amp; Network</text>
      <text x="16" y="55" class="mono" font-size="14.5" font-weight="800" fill="#c084fc">randomize_va_space = 2</text>
    </g>

    <!-- Node 3: Host Firewall -->
    <g transform="translate(14, 228)">
      <rect width="262" height="76" rx="8" fill="#131e33" stroke="#223554" stroke-width="1.5" />
      <rect x="0" y="0" width="5" height="76" rx="2.5" fill="#f59e0b" />
      <text x="16" y="28" font-size="16" font-weight="800" fill="#ffffff">Host Firewall &amp; IPS</text>
      <text x="16" y="55" class="mono" font-size="14.5" font-weight="800" fill="#fbbf24">UFW Default Deny + Fail2Ban</text>
    </g>

    <!-- Node 4: Filesystem -->
    <g transform="translate(14, 312)">
      <rect width="262" height="76" rx="8" fill="#131e33" stroke="#223554" stroke-width="1.5" />
      <rect x="0" y="0" width="5" height="76" rx="2.5" fill="#10b981" />
      <text x="16" y="28" font-size="16" font-weight="800" fill="#ffffff">Filesystem Permissions</text>
      <text x="16" y="55" class="mono" font-size="14.5" font-weight="800" fill="#34d399">/etc/shadow 0640 (Root Only)</text>
    </g>
  </g>

  <!-- ========================================================================= -->
  <!-- BOTTOM STATS BANNER                                                       -->
  <!-- ========================================================================= -->
  <g transform="translate(25, 520)">
    <rect width="1030" height="100" rx="14" fill="#0d1526" stroke="#1e2c45" stroke-width="2" filter="url(#card-shadow)" />

    <!-- 100% Shield Badge (Left) -->
    <g transform="translate(20, 15)" class="pulse-shield">
      <rect width="270" height="70" rx="10" fill="url(#badge-green)" stroke="#34d399" stroke-width="2" />
      <circle cx="38" cy="35" r="22" fill="#064e3b" stroke="#a7f3d0" stroke-width="2" />
      <path d="M 29 35 L 36 42 L 48 28" fill="none" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />
      <text x="72" y="34" font-size="22" font-weight="900" fill="#ffffff">100% PASSING</text>
      <text x="72" y="56" font-size="14" font-weight="800" fill="#a7f3d0">CIS Benchmark Level 1</text>
    </g>

    <!-- 3 Huge Stats Blocks -->
    <g transform="translate(320, 16)">
      <!-- Stat 1 -->
      <g transform="translate(20, 0)">
        <text x="0" y="38" font-size="38" font-weight="900" fill="#38bdf8">15 / 15</text>
        <text x="0" y="60" font-size="13.5" font-weight="800" fill="#94a3b8">CIS CONTROLS VERIFIED</text>
      </g>

      <line x1="225" y1="8" x2="225" y2="62" stroke="#1e2c45" stroke-width="2" />

      <!-- Stat 2 -->
      <g transform="translate(255, 0)">
        <text x="0" y="38" font-size="38" font-weight="900" fill="#10b981">0.0%</text>
        <text x="0" y="60" font-size="13.5" font-weight="800" fill="#94a3b8">ZERO POSTURE DRIFT</text>
      </g>

      <line x1="455" y1="8" x2="455" y2="62" stroke="#1e2c45" stroke-width="2" />

      <!-- Stat 3 -->
      <g transform="translate(485, 0)">
        <text x="0" y="36" font-size="28" font-weight="900" fill="#f59e0b">IDEMPOTENT</text>
        <text x="0" y="60" font-size="13.5" font-weight="800" fill="#94a3b8">SAFE FLEET RE-RUNS</text>
      </g>
    </g>
  </g>
</svg>
