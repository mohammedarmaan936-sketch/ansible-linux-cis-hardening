<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070a12" />
      <stop offset="50%" stop-color="#0c1322" />
      <stop offset="100%" stop-color="#050811" />
    </linearGradient>

    <!-- Card Background Gradients -->
    <linearGradient id="card-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141e33" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#0d1526" stop-opacity="0.98" />
    </linearGradient>

    <linearGradient id="gate3-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06382b" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#04231b" stop-opacity="0.98" />
    </linearGradient>

    <linearGradient id="badge-grad-green" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#065f46" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="cyber-grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1f2d47" stroke-width="0.75" stroke-opacity="0.25" />
      <circle cx="0" cy="0" r="1.5" fill="#00f2fe" fill-opacity="0.2" />
    </pattern>

    <!-- Shadow Filter -->
    <filter id="card-shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000000" flood-opacity="0.6" />
    </filter>

    <!-- Styles & Typography -->
    <style>
      @keyframes dashFlow {
        from { stroke-dashoffset: 40; }
        to { stroke-dashoffset: 0; }
      }
      @keyframes badgePulse {
        0%, 100% { transform: scale(1); opacity: 0.95; }
        50% { transform: scale(1.02); opacity: 1; }
      }
      @keyframes beaconBlink {
        0%, 100% { fill: #10b981; filter: drop-shadow(0 0 4px #10b981); }
        50% { fill: #34d399; filter: drop-shadow(0 0 10px #34d399); }
      }
      .flowing-cyan {
        stroke-dasharray: 8, 8;
        animation: dashFlow 1.6s linear infinite;
      }
      .flowing-emerald {
        stroke-dasharray: 8, 8;
        animation: dashFlow 1.4s linear infinite;
      }
      .pulse-shield {
        animation: badgePulse 3s ease-in-out infinite;
        transform-origin: 180px 660px;
      }
      .beacon-dot {
        animation: beaconBlink 2s ease-in-out infinite;
      }
      text {
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        text-rendering: geometricPrecision;
      }
      .mono {
        font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
      }
    </style>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="760" fill="url(#bg-grad)" rx="16" />
  <rect width="1200" height="760" fill="url(#cyber-grid)" rx="16" />

  <!-- Ambient Glow Orbs -->
  <circle cx="100" cy="100" r="180" fill="#00f2fe" fill-opacity="0.04" />
  <circle cx="600" cy="350" r="220" fill="#8b5cf6" fill-opacity="0.03" />
  <circle cx="1100" cy="650" r="200" fill="#10b981" fill-opacity="0.04" />

  <!-- ========================================================================= -->
  <!-- TOP HEADER                                                                -->
  <!-- ========================================================================= -->
  <g transform="translate(40, 30)">
    <!-- Shield Logo -->
    <rect x="0" y="0" width="56" height="56" rx="14" fill="#162238" stroke="#00f2fe" stroke-width="2.5" />
    <path d="M 28 12 L 43 18 V 32 C 43 40.5 36.5 47.5 28 49.5 C 19.5 47.5 13 40.5 13 32 V 18 Z" fill="none" stroke="#00f2fe" stroke-width="2.5" stroke-linejoin="round" />
    <path d="M 21 31 L 26 36 L 36 24" fill="none" stroke="#10b981" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Title & Subtitle (Large & Crisp) -->
    <text x="74" y="30" font-size="26" font-weight="900" fill="#ffffff">ansible-linux-cis-hardening</text>
    <text x="74" y="52" font-size="15" font-weight="600" fill="#94a3b8">Production CIS Level 1 Server Baseline &amp; Continuous Drift Scanner</text>

    <!-- OS Badges (Top Right) -->
    <g transform="translate(800, 10)">
      <rect x="0" y="0" width="150" height="38" rx="8" fill="#1a2438" stroke="#e95420" stroke-width="2" />
      <circle cx="18" cy="19" r="6" fill="#e95420" />
      <text x="32" y="24" font-size="14" font-weight="800" fill="#ffffff">Ubuntu 22.04</text>

      <rect x="165" y="0" width="150" height="38" rx="8" fill="#1a2438" stroke="#e95420" stroke-width="2" />
      <circle cx="183" cy="19" r="6" fill="#e95420" />
      <text x="197" y="24" font-size="14" font-weight="800" fill="#ffffff">Ubuntu 24.04</text>
    </g>
  </g>

  <!-- ========================================================================= -->
  <!-- CONNECTING ARROWS                                                         -->
  <!-- ========================================================================= -->
  <!-- Stage 1 -> Stage 2 -->
  <path d="M 350 345 L 390 345" fill="none" stroke="#253552" stroke-width="4" />
  <path d="M 350 345 L 390 345" fill="none" stroke="#00f2fe" stroke-width="3" class="flowing-cyan" />
  <polygon points="394,345 384,339 384,351" fill="#00f2fe" />

  <!-- Stage 2 -> Stage 3 -->
  <path d="M 850 345 L 890 345" fill="none" stroke="#253552" stroke-width="4" />
  <path d="M 850 345 L 890 345" fill="none" stroke="#10b981" stroke-width="3" class="flowing-emerald" />
  <polygon points="894,345 884,339 884,351" fill="#10b981" />

  <!-- ========================================================================= -->
  <!-- STAGE 1: DEVSECOPS SOURCE                                                 -->
  <!-- ========================================================================= -->
  <g transform="translate(40, 105)">
    <rect width="310" height="475" rx="14" fill="url(#card-grad)" stroke="#1e2c45" stroke-width="1.5" filter="url(#card-shadow)" />

    <!-- Header -->
    <rect width="310" height="48" rx="14" fill="#0e172a" />
    <path d="M 0 32 H 310 V 48 H 0 Z" fill="#0e172a" />
    <circle cx="24" cy="24" r="6" fill="#3b82f6" />
    <text x="40" y="29" font-size="16" font-weight="900" fill="#ffffff">1. DEVSECOPS TRIGGER</text>

    <!-- Box 1: Git Push -->
    <g transform="translate(16, 62)">
      <rect width="278" height="82" rx="10" fill="#17223b" stroke="#293b5e" stroke-width="1.5" />
      <text x="16" y="30" class="mono" font-size="15" font-weight="800" fill="#38bdf8">git push origin main</text>
      <text x="16" y="52" font-size="14" font-weight="600" fill="#f1f5f9">Master Playbook Trigger</text>
      <text x="16" y="70" class="mono" font-size="13" fill="#94a3b8">commit: CIS-Baseline-L1</text>
    </g>

    <!-- Box 2: Master Playbook -->
    <g transform="translate(16, 156)">
      <rect width="278" height="70" rx="10" fill="#131b2e" stroke="#1f2d47" stroke-width="1.5" />
      <text x="16" y="30" class="mono" font-size="16" font-weight="800" fill="#ffffff">site.yml</text>
      <text x="16" y="52" font-size="14" font-weight="600" fill="#94a3b8">Master Hardening Playbook</text>
    </g>

    <!-- Box 3: Role Architecture -->
    <g transform="translate(16, 238)">
      <rect width="278" height="74" rx="10" fill="#131b2e" stroke="#1f2d47" stroke-width="1.5" />
      <text x="16" y="30" class="mono" font-size="15" font-weight="800" fill="#ffffff">cis_ubuntu_hardening</text>
      <text x="16" y="52" font-size="13.5" font-weight="600" fill="#94a3b8">Modular Ansible Role Structure</text>
    </g>

    <!-- Box 4: Inventory -->
    <g transform="translate(16, 324)">
      <rect width="278" height="70" rx="10" fill="#131b2e" stroke="#1f2d47" stroke-width="1.5" />
      <text x="16" y="30" class="mono" font-size="15" font-weight="800" fill="#ffffff">inventory/hosts.ini</text>
      <text x="16" y="52" font-size="14" font-weight="600" fill="#94a3b8">EC2 Production &amp; Staging</text>
    </g>

    <!-- Box 5: Variables -->
    <g transform="translate(16, 406)">
      <rect width="278" height="58" rx="8" fill="#131b2e" stroke="#1f2d47" stroke-width="1" />
      <text x="16" y="26" class="mono" font-size="14" font-weight="700" fill="#cbd5e1">defaults/main.yml</text>
      <text x="16" y="44" font-size="13" font-weight="500" fill="#64748b">Centralized Config Variables</text>
    </g>
  </g>

  <!-- ========================================================================= -->
  <!-- STAGE 2: GITHUB ACTIONS CI/CD VERIFICATION GATES                          -->
  <!-- ========================================================================= -->
  <g transform="translate(390, 105)">
    <rect width="460" height="475" rx="14" fill="url(#card-grad)" stroke="#38bdf8" stroke-width="2" stroke-opacity="0.5" filter="url(#card-shadow)" />

    <!-- Header -->
    <rect width="460" height="48" rx="14" fill="#0e172a" />
    <path d="M 0 32 H 460 V 48 H 0 Z" fill="#0e172a" />
    <circle cx="24" cy="24" r="6" fill="#8b5cf6" />
    <text x="40" y="30" font-size="16" font-weight="900" fill="#ffffff">2. CI/CD VERIFICATION GATES</text>
    <rect x="360" y="11" width="85" height="26" rx="6" fill="#1e293b" />
    <text x="373" y="28" font-size="13" font-weight="900" fill="#38bdf8">4 GATES</text>

    <!-- Gate 1: Syntax Check -->
    <g transform="translate(16, 60)">
      <rect width="428" height="82" rx="10" fill="#131d30" stroke="#223352" stroke-width="1.5" />
      <circle cx="26" cy="28" r="13" fill="#065f46" />
      <path d="M 20 28 L 24 32 L 32 23" fill="none" stroke="#a7f3d0" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" />
      <text x="48" y="26" font-size="16" font-weight="800" fill="#ffffff">Gate 1: Syntax Validation</text>
      <rect x="345" y="14" width="70" height="24" rx="5" fill="#064e3b" />
      <text x="355" y="30" font-size="12" font-weight="900" fill="#34d399">PASSED</text>
      <text x="48" y="52" class="mono" font-size="13.5" font-weight="600" fill="#38bdf8">ansible-playbook --syntax-check</text>
      <text x="48" y="70" font-size="13" font-weight="600" fill="#10b981">✓ All plays and includes verified</text>
    </g>

    <!-- Gate 2: Ansible-Lint -->
    <g transform="translate(16, 152)">
      <rect width="428" height="82" rx="10" fill="#131d30" stroke="#223352" stroke-width="1.5" />
      <circle cx="26" cy="28" r="13" fill="#065f46" />
      <path d="M 20 28 L 24 32 L 32 23" fill="none" stroke="#a7f3d0" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" />
      <text x="48" y="26" font-size="16" font-weight="800" fill="#ffffff">Gate 2: Ansible-Lint Quality</text>
      <rect x="345" y="14" width="70" height="24" rx="5" fill="#064e3b" />
      <text x="355" y="30" font-size="12" font-weight="900" fill="#34d399">PASSED</text>
      <text x="48" y="52" class="mono" font-size="13.5" font-weight="600" fill="#38bdf8">yamllint . &amp;&amp; ansible-lint</text>
      <text x="48" y="70" font-size="13" font-weight="600" fill="#10b981">✓ Security best practices enforced</text>
    </g>

    <!-- Gate 3: CIS Benchmark Scanner (PROMINENT HERO CARD) -->
    <g transform="translate(16, 244)">
      <rect width="428" height="126" rx="10" fill="url(#gate3-grad)" stroke="#10b981" stroke-width="2.5" />
      <circle cx="26" cy="30" r="14" fill="#047857" />
      <path d="M 19 30 L 24 35 L 33 24" fill="none" stroke="#ffffff" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" />
      <text x="50" y="26" font-size="16.5" font-weight="900" fill="#34d399">Gate 3: CIS Compliance Gate</text>
      <rect x="330" y="12" width="85" height="26" rx="6" fill="#10b981" />
      <text x="338" y="30" font-size="13" font-weight="900" fill="#022c22">100% PASS</text>

      <text x="50" y="54" class="mono" font-size="14" font-weight="700" fill="#ffffff">python3 scripts/cis_compliance_audit.py</text>
      <text x="50" y="78" font-size="15" font-weight="800" fill="#a7f3d0">Score: 100.0% (15 / 15 Controls Verified)</text>

      <rect x="50" y="90" width="365" height="26" rx="5" fill="#032b21" />
      <text x="60" y="108" font-size="13" font-weight="700" fill="#6ee7b7">✓ Zero Security Drift • Mandatory Merge Barrier</text>
    </g>

    <!-- Gate 4: Container Dry-Run -->
    <g transform="translate(16, 380)">
      <rect width="428" height="84" rx="10" fill="#131d30" stroke="#223352" stroke-width="1.5" />
      <circle cx="26" cy="28" r="13" fill="#065f46" />
      <path d="M 20 28 L 24 32 L 32 23" fill="none" stroke="#a7f3d0" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" />
      <text x="48" y="26" font-size="16" font-weight="800" fill="#ffffff">Gate 4: Container Dry-Run</text>
      <rect x="345" y="14" width="70" height="24" rx="5" fill="#064e3b" />
      <text x="355" y="30" font-size="12" font-weight="900" fill="#34d399">PASSED</text>
      <text x="48" y="52" class="mono" font-size="13.5" font-weight="600" fill="#38bdf8">ansible-playbook --check --diff</text>
      <text x="48" y="72" font-size="13" font-weight="600" fill="#10b981">Matrix: Clean on Ubuntu 22.04 &amp; 24.04</text>
    </g>
  </g>

  <!-- ========================================================================= -->
  <!-- STAGE 3: HARDENED UBUNTU FLEET                                            -->
  <!-- ========================================================================= -->
  <g transform="translate(890, 105)">
    <rect width="270" height="475" rx="14" fill="url(#card-grad)" stroke="#10b981" stroke-width="2" stroke-opacity="0.5" filter="url(#card-shadow)" />

    <!-- Header -->
    <rect width="270" height="48" rx="14" fill="#0e172a" />
    <path d="M 0 32 H 270 V 48 H 0 Z" fill="#0e172a" />
    <circle cx="22" cy="24" r="6" fill="#10b981" class="beacon-dot" />
    <text x="38" y="30" font-size="16" font-weight="900" fill="#ffffff">3. HARDENED FLEET</text>

    <!-- Node 1: OpenSSH -->
    <g transform="translate(14, 60)">
      <rect width="242" height="96" rx="10" fill="#131e33" stroke="#223554" stroke-width="1.5" />
      <rect x="0" y="0" width="6" height="96" rx="3" fill="#00f2fe" />
      <text x="16" y="24" font-size="14.5" font-weight="800" fill="#ffffff">OpenSSH (CIS 5.2)</text>
      <text x="16" y="46" class="mono" font-size="14" font-weight="700" fill="#38bdf8">• PermitRootLogin no</text>
      <text x="16" y="68" class="mono" font-size="14" font-weight="700" fill="#38bdf8">• PasswordAuth no</text>
      <text x="16" y="88" class="mono" font-size="13" font-weight="600" fill="#94a3b8">MaxAuthTries: 4</text>
    </g>

    <!-- Node 2: Kernel Sysctl -->
    <g transform="translate(14, 164)">
      <rect width="242" height="96" rx="10" fill="#131e33" stroke="#223554" stroke-width="1.5" />
      <rect x="0" y="0" width="6" height="96" rx="3" fill="#a855f7" />
      <text x="16" y="24" font-size="14.5" font-weight="800" fill="#ffffff">Kernel Sysctl (CIS 1.5)</text>
      <text x="16" y="46" class="mono" font-size="13.5" font-weight="700" fill="#c084fc">• ASLR Level = 2</text>
      <text x="16" y="68" class="mono" font-size="13.5" font-weight="700" fill="#c084fc">• ip_forward = 0</text>
      <text x="16" y="88" class="mono" font-size="13" font-weight="600" fill="#94a3b8">SYN Cookies = 1</text>
    </g>

    <!-- Node 3: Firewall & IPS -->
    <g transform="translate(14, 268)">
      <rect width="242" height="96" rx="10" fill="#131e33" stroke="#223554" stroke-width="1.5" />
      <rect x="0" y="0" width="6" height="96" rx="3" fill="#f59e0b" />
      <text x="16" y="24" font-size="14.5" font-weight="800" fill="#ffffff">Host Firewall (CIS 3.5)</text>
      <text x="16" y="46" class="mono" font-size="14" font-weight="700" fill="#fbbf24">• UFW Deny Inbound</text>
      <text x="16" y="68" class="mono" font-size="13.5" font-weight="700" fill="#fbbf24">• Ports 22, 80, 443</text>
      <text x="16" y="88" class="mono" font-size="13" font-weight="600" fill="#94a3b8">Fail2Ban SSH Jails</text>
    </g>

    <!-- Node 4: Filesystem & Auth -->
    <g transform="translate(14, 372)">
      <rect width="242" height="94" rx="10" fill="#131e33" stroke="#223554" stroke-width="1.5" />
      <rect x="0" y="0" width="6" height="94" rx="3" fill="#10b981" />
      <text x="16" y="24" font-size="14.5" font-weight="800" fill="#ffffff">Filesystem (CIS 1.1)</text>
      <text x="16" y="46" class="mono" font-size="13" font-weight="700" fill="#34d399">• cramfs, usb disabled</text>
      <text x="16" y="66" class="mono" font-size="13" font-weight="700" fill="#34d399">• /etc/shadow (0640)</text>
      <text x="16" y="86" class="mono" font-size="13" font-weight="600" fill="#94a3b8">PASS_MAX_DAYS 90</text>
    </g>
  </g>

  <!-- ========================================================================= -->
  <!-- BOTTOM COMPLIANCE STATS BANNER                                            -->
  <!-- ========================================================================= -->
  <g transform="translate(40, 595)">
    <rect width="1120" height="135" rx="14" fill="#0d1526" stroke="#1e2c45" stroke-width="2" filter="url(#card-shadow)" />

    <!-- 100% Shield Badge (Left) -->
    <g transform="translate(24, 22)" class="pulse-shield">
      <rect width="280" height="90" rx="12" fill="url(#badge-grad-green)" stroke="#34d399" stroke-width="2.5" />
      <circle cx="46" cy="45" r="26" fill="#064e3b" stroke="#a7f3d0" stroke-width="2" />
      <path d="M 35 45 L 43 53 L 58 37" fill="none" stroke="#ffffff" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" />
      <text x="86" y="42" font-size="22" font-weight="900" fill="#ffffff">100% PASSING</text>
      <text x="86" y="68" font-size="14" font-weight="800" fill="#a7f3d0">CIS Level 1 Certified</text>
    </g>

    <!-- 3 Big Metric Columns -->
    <g transform="translate(345, 24)">
      <!-- Col 1 -->
      <g transform="translate(20, 0)">
        <text x="0" y="20" font-size="13" font-weight="800" fill="#94a3b8">BENCHMARK CONTROLS</text>
        <text x="0" y="58" font-size="36" font-weight="900" fill="#38bdf8">15 / 15</text>
        <text x="0" y="82" font-size="14" font-weight="700" fill="#34d399">100% Verified in CI</text>
      </g>

      <line x1="225" y1="10" x2="225" y2="82" stroke="#1e2c45" stroke-width="2" />

      <!-- Col 2 -->
      <g transform="translate(265, 0)">
        <text x="0" y="20" font-size="13" font-weight="800" fill="#94a3b8">CONFIGURATION DRIFT</text>
        <text x="0" y="58" font-size="36" font-weight="900" fill="#10b981">0.0%</text>
        <text x="0" y="82" font-size="14" font-weight="700" fill="#a7f3d0">Zero Posture Drift</text>
      </g>

      <line x1="475" y1="10" x2="475" y2="82" stroke="#1e2c45" stroke-width="2" />

      <!-- Col 3 -->
      <g transform="translate(515, 0)">
        <text x="0" y="20" font-size="13" font-weight="800" fill="#94a3b8">ENFORCEMENT MODE</text>
        <text x="0" y="56" font-size="30" font-weight="900" fill="#f59e0b">IDEMPOTENT</text>
        <text x="0" y="82" font-size="14" font-weight="700" fill="#fcd34d">Safe For Live Production Fleet</text>
      </g>
    </g>
  </g>
</svg>
