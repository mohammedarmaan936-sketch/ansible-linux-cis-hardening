---
# ==============================================================================
# CIS Benchmark Level 1 Hardening - Default Variables
# Target OS: Ubuntu 22.04 / 24.04 LTS
# Reference: CIS Ubuntu Linux Benchmark v1.0.0+ Level 1 Server
# ==============================================================================

# ------------------------------------------------------------------------------
# SSH Daemon Configuration (CIS Section 5.2)
# ------------------------------------------------------------------------------
cis_ssh_port: 22
cis_ssh_permit_root_login: "no"                # CIS 5.2.4
cis_ssh_password_authentication: "no"          # CIS 5.2.11
cis_ssh_max_auth_tries: 4                      # CIS 5.2.5
cis_ssh_client_alive_interval: 300             # CIS 5.2.15
cis_ssh_client_alive_count_max: 3              # CIS 5.2.16
cis_ssh_x11_forwarding: "no"                   # CIS 5.2.6
cis_ssh_protocol: 2
cis_ssh_allow_tcp_forwarding: "no"             # CIS 5.2.7
cis_ssh_max_startups: "10:30:60"               # CIS 5.2.17
cis_ssh_login_grace_time: 60                   # CIS 5.2.14
cis_ssh_banner: "/etc/issue.net"               # CIS 5.2.18
cis_ssh_loglevel: "VERBOSE"                    # CIS 5.2.3
cis_ssh_ignore_rhosts: "yes"                   # CIS 5.2.8
cis_ssh_hostbased_authentication: "no"         # CIS 5.2.9
cis_ssh_permit_empty_passwords: "no"           # CIS 5.2.10
cis_ssh_permit_user_environment: "no"          # CIS 5.2.12
cis_ssh_use_pam: "yes"                         # CIS 5.2.19

# Allowed SSH users (set empty list to disable AllowUsers directive)
cis_ssh_allowed_users:
  - ubuntu
  - secops

# Cryptographic Suite for OpenSSH
cis_ssh_ciphers:
  - "chacha20-poly1305@openssh.com"
  - "aes256-gcm@openssh.com"
  - "aes128-gcm@openssh.com"
  - "aes256-ctr"
  - "aes192-ctr"
  - "aes128-ctr"

cis_ssh_macs:
  - "hmac-sha2-512-etm@openssh.com"
  - "hmac-sha2-256-etm@openssh.com"
  - "umac-128-etm@openssh.com"

cis_ssh_kex_algorithms:
  - "curve25519-sha256"
  - "curve25519-sha256@libssh.org"
  - "diffie-hellman-group14-sha256"
  - "diffie-hellman-group16-sha512"
  - "diffie-hellman-group18-sha512"

# ------------------------------------------------------------------------------
# Kernel & Network Sysctl Settings (CIS Section 1.5, 3.1, 3.2)
# ------------------------------------------------------------------------------
cis_sysctl_kernel_randomize_va_space: 2        # CIS 1.5.1 - Enable ASLR
cis_sysctl_fs_suid_dumpable: 0                 # CIS 1.5.3 - Restrict core dumps

# IP Forwarding & Routing
cis_sysctl_net_ipv4_ip_forward: 0              # CIS 3.1.1 - Disable IP Forwarding
cis_sysctl_net_ipv4_conf_all_send_redirects: 0 # CIS 3.1.2 - Disable Send Redirects
cis_sysctl_net_ipv4_conf_default_send_redirects: 0

# ICMP & Packet Redirects
cis_sysctl_net_ipv4_conf_all_accept_redirects: 0     # CIS 3.2.1 - Disable Accept Redirects
cis_sysctl_net_ipv4_conf_default_accept_redirects: 0
cis_sysctl_net_ipv4_conf_all_secure_redirects: 0     # CIS 3.2.2 - Disable Secure Redirects
cis_sysctl_net_ipv4_conf_default_secure_redirects: 0

# Source Routing & Logging
cis_sysctl_net_ipv4_conf_all_accept_source_route: 0  # CIS 3.2.3 - Disable Source Route
cis_sysctl_net_ipv4_conf_default_accept_source_route: 0
cis_sysctl_net_ipv4_conf_all_log_martians: 1         # CIS 3.2.4 - Log Suspicious Packets
cis_sysctl_net_ipv4_conf_default_log_martians: 1

# Broadcast & Spoofing Protection
cis_sysctl_net_ipv4_icmp_echo_ignore_broadcasts: 1   # CIS 3.2.5 - Ignore Broadcast ICMP
cis_sysctl_net_ipv4_icmp_ignore_bogus_error_responses: 1 # CIS 3.2.6 - Ignore Bogus ICMP
cis_sysctl_net_ipv4_conf_all_rp_filter: 1            # CIS 3.2.7 - Reverse Path Filtering
cis_sysctl_net_ipv4_conf_default_rp_filter: 1
cis_sysctl_net_ipv4_tcp_syncookies: 1                # CIS 3.2.8 - Enable TCP SYN Cookies

# IPv6 Controls
cis_sysctl_net_ipv6_conf_all_accept_ra: 0            # CIS 3.3.1 - Disable Router Advertisements
cis_sysctl_net_ipv6_conf_default_accept_ra: 0
cis_sysctl_net_ipv6_conf_all_accept_redirects: 0     # CIS 3.3.2 - Disable IPv6 Redirects
cis_sysctl_net_ipv6_conf_default_accept_redirects: 0

# ------------------------------------------------------------------------------
# Filesystem Storage Modules (CIS Section 1.1.1)
# ------------------------------------------------------------------------------
cis_disabled_filesystems:
  - cramfs          # CIS 1.1.1.1
  - freevxfs        # CIS 1.1.1.2
  - jffs2           # CIS 1.1.1.3
  - hfs             # CIS 1.1.1.4
  - hfsplus         # CIS 1.1.1.5
  - squashfs        # CIS 1.1.1.6
  - udf             # CIS 1.1.1.7
  - usb-storage     # CIS 1.1.1.8

# Critical System File Permissions
cis_file_permissions:
  - path: "/etc/passwd"
    owner: "root"
    group: "root"
    mode: "0644"    # CIS 6.1.2
  - path: "/etc/shadow"
    owner: "root"
    group: "shadow"
    mode: "0640"    # CIS 6.1.3
  - path: "/etc/group"
    owner: "root"
    group: "root"
    mode: "0644"    # CIS 6.1.4
  - path: "/etc/gshadow"
    owner: "root"
    group: "shadow"
    mode: "0640"    # CIS 6.1.5
  - path: "/etc/passwd-"
    owner: "root"
    group: "root"
    mode: "0600"    # CIS 6.1.6
  - path: "/etc/shadow-"
    owner: "root"
    group: "shadow"
    mode: "0600"    # CIS 6.1.7
  - path: "/etc/group-"
    owner: "root"
    group: "root"
    mode: "0600"    # CIS 6.1.8
  - path: "/etc/gshadow-"
    owner: "root"
    group: "shadow"
    mode: "0600"    # CIS 6.1.9
  - path: "/etc/ssh/sshd_config"
    owner: "root"
    group: "root"
    mode: "0600"    # CIS 5.2.1

# ------------------------------------------------------------------------------
# User & Password Aging Policies (CIS Section 5.4.1)
# ------------------------------------------------------------------------------
cis_pass_max_days: 90   # CIS 5.4.1.1 - Maximum days password is valid
cis_pass_min_days: 7    # CIS 5.4.1.2 - Minimum days before password can change
cis_pass_warn_age: 14   # CIS 5.4.1.3 - Password expiration warning in days
cis_pass_min_len: 14    # CIS 5.3.1 - Password minimum length
cis_umask: "027"        # CIS 5.4.4 - Default user UMASK

# ------------------------------------------------------------------------------
# Firewall & Intrusion Prevention (CIS Section 3.5 & Fail2Ban)
# ------------------------------------------------------------------------------
cis_ufw_manage: true
cis_ufw_default_incoming_policy: "deny"      # CIS 3.5.1.3
cis_ufw_default_outgoing_policy: "allow"
cis_ufw_default_routed_policy: "deny"
cis_ufw_allowed_ports:
  - 22
  - 80
  - 443

cis_fail2ban_enabled: true
cis_fail2ban_maxretry: 5
cis_fail2ban_bantime: 3600
cis_fail2ban_findtime: 600

# ------------------------------------------------------------------------------
# Login Warning Banner Content (CIS Section 1.7)
# ------------------------------------------------------------------------------
cis_issue_net_content: |
  *******************************************************************************
  *                           AUTHORIZED ACCESS ONLY                            *
  * This system is restricted to authorized personnel for legitimate business   *
  * operations only. Unauthorized access, attempt, or manipulation is strictly  *
  * prohibited and monitored. Evidence of illicit use will be reported to law   *
  * enforcement and subject to criminal prosecution. All activities logged.    *
  *******************************************************************************
