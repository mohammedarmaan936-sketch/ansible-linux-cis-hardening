---
# ==============================================================================
# CIS Benchmark - Section 1.5, 3.1, 3.2: Kernel Parameters & Network Security
# ==============================================================================

- name: Deploy hardened CIS kernel parameters configuration
  ansible.builtin.copy:
    dest: /etc/sysctl.d/99-cis-hardening.conf
    owner: root
    group: root
    mode: "0644"
    content: |
      # CIS Benchmark Ubuntu 22.04 / 24.04 Hardening Sysctl Settings
      # Managed by Ansible: cis_ubuntu_hardening role

      # CIS 1.5.1 - Ensure ASLR (Address Space Layout Randomization) is enabled
      kernel.randomize_va_space = {{ cis_sysctl_kernel_randomize_va_space }}

      # CIS 1.5.3 - Restrict core dumps for SUID executables
      fs.suid_dumpable = {{ cis_sysctl_fs_suid_dumpable }}

      # CIS 3.1.1 - Ensure IP forwarding is disabled
      net.ipv4.ip_forward = {{ cis_sysctl_net_ipv4_ip_forward }}

      # CIS 3.1.2 - Ensure packet redirect sending is disabled
      net.ipv4.conf.all.send_redirects = {{ cis_sysctl_net_ipv4_conf_all_send_redirects }}
      net.ipv4.conf.default.send_redirects = {{ cis_sysctl_net_ipv4_conf_default_send_redirects }}

      # CIS 3.2.1 - Ensure packet redirect acceptance is disabled
      net.ipv4.conf.all.accept_redirects = {{ cis_sysctl_net_ipv4_conf_all_accept_redirects }}
      net.ipv4.conf.default.accept_redirects = {{ cis_sysctl_net_ipv4_conf_default_accept_redirects }}

      # CIS 3.2.2 - Ensure secure ICMP redirects are not accepted
      net.ipv4.conf.all.secure_redirects = {{ cis_sysctl_net_ipv4_conf_all_secure_redirects }}
      net.ipv4.conf.default.secure_redirects = {{ cis_sysctl_net_ipv4_conf_default_secure_redirects }}

      # CIS 3.2.3 - Ensure source routed packets are not accepted
      net.ipv4.conf.all.accept_source_route = {{ cis_sysctl_net_ipv4_conf_all_accept_source_route }}
      net.ipv4.conf.default.accept_source_route = {{ cis_sysctl_net_ipv4_conf_default_accept_source_route }}

      # CIS 3.2.4 - Ensure suspicious packets (martians) are logged
      net.ipv4.conf.all.log_martians = {{ cis_sysctl_net_ipv4_conf_all_log_martians }}
      net.ipv4.conf.default.log_martians = {{ cis_sysctl_net_ipv4_conf_default_log_martians }}

      # CIS 3.2.5 - Ensure broadcast ICMP requests are ignored
      net.ipv4.icmp_echo_ignore_broadcasts = {{ cis_sysctl_net_ipv4_icmp_echo_ignore_broadcasts }}

      # CIS 3.2.6 - Ensure bogus ICMP error responses are ignored
      net.ipv4.icmp_ignore_bogus_error_responses = {{ cis_sysctl_net_ipv4_icmp_ignore_bogus_error_responses }}

      # CIS 3.2.7 - Ensure Reverse Path Filtering is enabled
      net.ipv4.conf.all.rp_filter = {{ cis_sysctl_net_ipv4_conf_all_rp_filter }}
      net.ipv4.conf.default.rp_filter = {{ cis_sysctl_net_ipv4_conf_default_rp_filter }}

      # CIS 3.2.8 - Ensure TCP SYN Cookies is enabled
      net.ipv4.tcp_syncookies = {{ cis_sysctl_net_ipv4_tcp_syncookies }}

      # CIS 3.3.1 & 3.3.2 - IPv6 Router Advertisements & Redirects
      net.ipv6.conf.all.accept_ra = {{ cis_sysctl_net_ipv6_conf_all_accept_ra }}
      net.ipv6.conf.default.accept_ra = {{ cis_sysctl_net_ipv6_conf_default_accept_ra }}
      net.ipv6.conf.all.accept_redirects = {{ cis_sysctl_net_ipv6_conf_all_accept_redirects }}
      net.ipv6.conf.default.accept_redirects = {{ cis_sysctl_net_ipv6_conf_default_accept_redirects }}
  notify: reload sysctl
  tags:
    - kernel
    - cis

- name: Apply sysctl configuration immediately
  ansible.builtin.command:
    cmd: sysctl -p /etc/sysctl.d/99-cis-hardening.conf
  changed_when: false
  failed_when: false
  tags:
    - kernel
    - cis
