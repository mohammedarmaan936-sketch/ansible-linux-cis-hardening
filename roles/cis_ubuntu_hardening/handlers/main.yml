---
# ==============================================================================
# CIS Hardening Role Handlers
# Handlers only trigger when task states report 'changed'
# ==============================================================================

- name: Restart sshd
  ansible.builtin.service:
    name: "{{ 'ssh' if ansible_os_family == 'Debian' else 'sshd' }}"
    state: restarted
  listen: "restart sshd"

- name: Reload sysctl
  ansible.builtin.command:
    cmd: sysctl --system
  changed_when: true
  listen: "reload sysctl"

- name: Restart ufw
  ansible.builtin.service:
    name: ufw
    state: restarted
  listen: "restart ufw"

- name: Restart fail2ban
  ansible.builtin.service:
    name: fail2ban
    state: restarted
  listen: "restart fail2ban"
